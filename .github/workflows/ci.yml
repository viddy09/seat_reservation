name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: No floating point in any Java source (money is integer paise)
        run: |
          if grep -rnE --include='*.java' '^\s*[^/* ].*\b(float|double|Float|Double|BigDecimal)\b' .; then
            echo "Floating point type found"; exit 1
          fi

      # Compiles with -Xlint:all -Werror, runs Checkstyle, unit + Testcontainers integration/concurrency tests
      # (the hosted runner provides Docker), then Spotless check.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Docker build
        run: docker build -t seat-service:ci .
