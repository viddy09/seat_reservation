# `docker compose up --build` from a fresh clone: no .env needed (safe local defaults below), see .env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatres
      POSTGRES_USER: seatres
      POSTGRES_PASSWORD: seatres
    command: ["postgres", "-c", "max_connections=100"]
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatres -d seatres"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same form the platform injects; converted to JDBC settings at startup.
      DATABASE_URL: postgres://seatres:seatres@postgres:5432/seatres
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-0123456789abcdef}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-admin-key}
      ALLOW_DEV_TOKENS: ${ALLOW_DEV_TOKENS:-true}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8080
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    # Longer than the app's 30s graceful-shutdown phase so in-flight requests can drain.
    stop_grace_period: 45s

volumes:
  pgdata:
